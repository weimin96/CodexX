name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6.0.3

      - name: 安装 Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: |
          npm install --global pnpm@9.15.9
          pnpm --version

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

  rust:
    name: Rust 回归
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: 检出代码
        uses: actions/checkout@v6.0.3

      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 检查 Rust 格式
        run: cargo fmt --check

      - name: 运行 Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行 Rust 测试
        run: cargo test

  audit:
    name: 依赖漏洞检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6.0.3

      - name: 安装 Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install --global pnpm@9.15.9

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查 npm 生产依赖漏洞
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked

      - name: 检查 Cargo 已知漏洞
        working-directory: src-tauri
        run: cargo audit

  dependency-review:
    name: 依赖变更审查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v6.0.3

      - name: 审查依赖变更
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
