name: Tag 发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 安装包
            platform: windows-latest
            args: ''
          - name: macOS Intel 安装包
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rustTargets: x86_64-apple-darwin
          - name: macOS Apple Silicon 安装包
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: 安装 pnpm
        run: |
          npm install --global pnpm@9.15.9
          pnpm --version

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 构建目标
        if: startsWith(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 updater 签名密钥
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}")) {
            throw "缺少仓库 Secret TAURI_SIGNING_PRIVATE_KEY，无法生成在线更新签名。"
          }

      - name: 读取当前版本发布说明
        id: release_notes
        run: node .github/scripts/resolve-release-notes.mjs "${{ github.ref_name }}"

      # GitHub Releases 同时承担安装包分发和 latest.json 更新入口。
      - name: 构建并上传到 GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CodexX ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          tauriScript: pnpm tauri
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-checksums:
    name: 发布 SHA256SUMS
    runs-on: ubuntu-latest
    needs: publish-tauri
    steps:
      - name: 下载 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-assets --clobber

      - name: 生成 SHA256SUMS
        shell: pwsh
        run: |
          $assetDirectory = Resolve-Path -LiteralPath "release-assets"
          $lines = Get-ChildItem -LiteralPath $assetDirectory -File |
            Where-Object { $_.Name -notlike "SHA256SUMS*" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          if ($lines.Count -eq 0) {
            throw "Release 中没有可生成 SHA256SUMS 的资产。"
          }

          Set-Content -LiteralPath "SHA256SUMS" -Value $lines -Encoding utf8NoBOM

      - name: 上传 SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
