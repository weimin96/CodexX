name: Tag 发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 安装包
            platform: windows-latest
            args: ''
          - name: macOS Intel 安装包
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rustTargets: x86_64-apple-darwin
          - name: macOS Apple Silicon 安装包
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin

    steps:
      - name: 检出代码
        uses: actions/checkout@v6.0.2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6.0.1
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 构建目标
        if: startsWith(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 updater 签名密钥
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}")) {
            throw "缺少仓库 Secret TAURI_SIGNING_PRIVATE_KEY，无法生成在线更新签名。"
          }

      # GitHub Releases 同时承担安装包分发和 latest.json 更新入口。
      - name: 构建并上传到 GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CodexX ${{ github.ref_name }}
          releaseBody: |
            自动发布于 GitHub Actions。

            稳定更新入口：
            https://github.com/weimin96/CodexX/releases/latest/download/latest.json

            请在下方 Assets 中下载对应平台的安装包。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          tauriScript: pnpm tauri
          includeUpdaterJson: true
          args: ${{ matrix.args }}
